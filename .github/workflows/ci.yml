name: CI

# Lint + tests (ported from xValue). Manual-only: src/update.py runs the same
# tests locally before every publish.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      # correctness-only rules, not style
      - name: Lint (ruff)
        run: ruff check src tests --select E9,F63,F7,F82,F401,F841
      - name: Tests
        run: python -m pytest -q tests
